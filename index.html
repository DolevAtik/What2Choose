<!doctype html>
<html lang="en" class="bg-[#09090b] text-gray-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- ═══════════════════════════════════════════════ -->
    <!--  PRIMARY SEO                                    -->
    <!-- ═══════════════════════════════════════════════ -->
    <title>What2Choose – Let the World Decide</title>
    <meta name="description" content="Post two (or more) options, let the community vote and decide for you. The social A/B decision platform – fashion, food, shopping, travel and more." />
    <meta name="keywords" content="what to choose, decision help, poll, vote, A/B, fashion, food, shopping, travel, community" />
    <meta name="author" content="What2Choose" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://what2-choose.vercel.app/" />

    <!-- ═══════════════════════════════════════════════ -->
    <!--  FAVICON & APP ICONS                           -->
    <!-- ═══════════════════════════════════════════════ -->
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />
    <meta name="theme-color" content="#8b5cf6" />

    <!-- ═══════════════════════════════════════════════ -->
    <!--  OPEN GRAPH (Facebook, WhatsApp, Telegram)     -->
    <!-- ═══════════════════════════════════════════════ -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://what2-choose.vercel.app/" />
    <meta property="og:site_name"   content="What2Choose" />
    <meta property="og:title"       content="What2Choose – Let the World Decide" />
    <meta property="og:description" content="Can't decide? Post your options and let the community vote! Fashion, food, shopping, travel – the world will choose for you. ⚡" />
    <meta property="og:image"       content="https://what2-choose.vercel.app/logo_seo.jpeg" />
    <meta property="og:image:width"  content="500" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:alt"   content="What2Choose – Social Decision Platform" />
    <meta property="og:locale"      content="en_US" />

    <!-- ═══════════════════════════════════════════════ -->
    <!--  TWITTER CARD                                  -->
    <!-- ═══════════════════════════════════════════════ -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="What2Choose – Let the World Decide" />
    <meta name="twitter:description" content="Can't decide? Post your options and let the community vote! ⚡" />
    <meta name="twitter:image"       content="https://what2-choose.vercel.app/logo_seo.jpeg" />

    <!-- ═══════════════════════════════════════════════ -->
    <!--  PWA / MOBILE                                  -->
    <!-- ═══════════════════════════════════════════════ -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="What2Choose" />
    <meta name="application-name" content="What2Choose" />

    <!-- ═══════════════════════════════════════════════ -->
    <!--  STRUCTURED DATA (JSON-LD)                     -->
    <!-- ═══════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "What2Choose",
      "url": "https://what2-choose.vercel.app/",
      "description": "The social A/B decision platform. Post two or more options and let the community vote.",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "logo": "https://what2-choose.vercel.app/logo.jpeg"
    }
    </script>

    <!-- ═══════════════════════════════════════════════ -->
    <!--  FONTS                                         -->
    <!-- ═══════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#09090b]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
